name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # the former core/debug/frontend/numpy/awkward siblings are now one consolidated package
  GRAPHED: "graphed[awkward,numpy] @ git+https://github.com/graphed-org/graphed@main"
  # corpus stays a separate package (test fixtures only, not shipped in the graphed wheel)
  CORPUS: "graphed-corpus @ git+https://github.com/graphed-org/graphed-corpus-mvp@main"

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps + this package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}"
          python -m pip install -e ".[dev]"
      - uses: astral-sh/setup-uv@v5
      - name: Lint + types (pre-commit hooks via prek)
        run: uvx prek@0.4.5 run --all-files --show-diff-on-failure
      - name: Pytest + coverage gate (>=90%)
        run: pytest tests/frozen --cov=graphed_executors --cov-branch --cov-report=term-missing

  # Free-threaded / bleeding-edge Pythons (plan A.5): genuinely exercises concurrency under no-GIL.
  # Experimental + non-blocking (awkward wheels may lag on 3.14 / 3.14t).
  test-experimental:
    name: test (experimental) py${{ matrix.python }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}"
          python -m pip install -e ".[dev]"
          pytest tests/frozen

  # The dask.distributed backend (graphed_executors.dask_backend) lives behind the [dask] extra and
  # importorskips out of the main matrix. This dedicated job installs it and runs the m42 dask suite
  # with coverage scoped to the NEW subpackages only (.coveragerc-dask, fail_under 90 — the §B.3
  # diff-coverage gate). pyarrow is a runtime need of the parquet parity surfaces (ak.to_parquet).
  # m43/m44 extend this job's pytest path (cov scope unchanged: all m43/m44 code is under dask_backend/).
  test-dask:
    name: test-dask py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps + this package with the dask extra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" pyarrow pandas
          python -m pip install -e ".[dev,dask]"
      - name: Pytest m42+m43+m44 dask suite + scoped coverage gate (>=90%)
        run: |
          pytest tests/frozen/m42 tests/frozen/m43 tests/frozen/m44 --cov-config=.coveragerc-dask \
            --cov-branch --cov=graphed_executors.submit --cov=graphed_executors.dask_backend \
            --cov-report=term-missing
      - name: Pytest m43 join-parity witnesses (non-gating; interim until the frozen fixup lands)
        run: pytest tests/extra/m43 -q
      - name: Pytest m44 transport witnesses (non-gating)
        run: pytest tests/extra/m44 -q

  docs:
    name: docs (sphinx -W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}"
          # docs only needs runtime deps + sphinx; the dev-extra backends are not on PyPI.
          python -m pip install -e ".[docs]"
          sphinx-build -W -b html docs docs/_build/html
