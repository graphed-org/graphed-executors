[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphed-executors"
version = "0.0.6"
description = "Run a graphed plan on threads, processes, a dask cluster, or a parsl pool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "graphed-org" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# graphed carries the execution contract (Plan/Task/Partition), Session, and StageError.
dependencies = ["graphed>=0.0.9", "cloudpickle"]

[project.optional-dependencies]
# the backends + corpus are only needed to exercise realistic HEP analyses end-to-end in the suite
dev = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "hypothesis",
  "mypy",
  "ruff",
  "diff_cover",
  "graphed[awkward,numpy]>=0.0.2",
  "graphed-corpus",
  # the frozen tree drives the varied-fill lowering end-to-end, which needs surfaces added after
  # histogram 0.0.1. No floor here: the two packages' dev extras would otherwise require each
  # other's next release before either can be cut. CI installs this and graphed from pinned
  # commits on main instead (the HISTOGRAM / GRAPHED env vars in ci.yml), so an upstream merge
  # cannot redden a frozen suite with no local change.
  "graphed-histogram",
  "numpy>=1.24",
  "awkward>=2.6",
]
docs = ["sphinx", "furo"]
# the dask.distributed backend (graphed_executors.dask_backend); pin floor covers py3.14 + the current
# register_plugin API + the lockstep dask==distributed release contract (lit §dask-api 0).
dask = ["dask[distributed]>=2026.6"]
# the parsl executor backend (graphed_executors.parsl_backend); the dated CalVer floor every claim
# was verified against. Deliberately NO python_version marker — the CI axis (gate 3.12, observe 3.13,
# exclude 3.14/3.14t), not the metadata, is the tested-support fence (plan §4).
parsl = ["parsl>=2026.7.20"]
# the direct HTCondor backend (graphed_executors.htcondor_backend); the floor is the version the LPC
# image resolves. No marker: the bindings ship Linux wheels only, so elsewhere the install fails loudly.
htcondor = ["htcondor>=25.13"]

[project.urls]
Homepage = "https://github.com/graphed-org/graphed-executors"

[tool.hatch.build.targets.wheel]
# graphed_executors is the package; graphed_exec_local is a back-compat shim (frozen suites import it)
packages = ["src/graphed_executors", "src/graphed_exec_local"]

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".graphed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/frozen/m7", "tests/frozen/m10", "tests/frozen/m31", "tests/frozen/m34", "tests/frozen/m37", "tests/frozen/m65", "tests/frozen/m68a", "tests/frozen/m69a", "tests/frozen/m74"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["graphed_executors"]
# The main matrix installs neither dask nor parsl (`.[dev]`), so every backend test importorskips
# out and `graphed_executors.{dask_backend,common,parsl_backend}` would otherwise register as ~0%
# and sink the whole-package gate. They are covered instead by the dedicated `test-dask` /
# `test-parsl` CI jobs (their own `.coveragerc-*`, per-module sources, 90% — the §B.3 diff-coverage
# gate; each `common/` module gated by exactly ONE job). `submit/` carries no omit: the ThreadBackend
# conformance half exercises it in the main matrix. This is the omit-because-gated-elsewhere pattern
# (m46 IT4) — NOT a fail_under change.
omit = ["*/dask_backend/*", "*/common/*", "*/parsl_backend/*", "*/htcondor_backend/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 99
src = ["src", "tests", "examples/hgg"]
target-version = "py311"
# the owner's original H->gg processor, kept byte-identical as the m69a oracle
extend-exclude = ["tests/frozen/m69a/data/inclusive_processor.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PLC0415", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# test functions are named for the behavior they check, so a docstring would restate the name
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
# the translation keeps the HiggsDNA processor's names so it reads line for line against the original
"examples/hgg/analysis.py" = ["N802", "N803", "N806", "N815"]
# the fakes stand in for htcondor2's class-named factories (Schedd, Collector, Credd, ...)
"tests/extra/m66/test_m66_launcher.py" = ["N802"]
"tests/extra/m68b/test_m68b_dag.py" = ["N802"]
"tests/extra/m69b/test_m69b_schedulable.py" = ["N802"]
"tests/frozen/m67/driverless_harness.py" = ["N802"]
"tests/frozen/m68a/services_harness.py" = ["N802"]
"tests/frozen/m68b/m68b_dag_harness.py" = ["N802"]
"tests/frozen/m68b/m68b_harness.py" = ["N802"]
"tests/frozen/m68c/test_m68c_htcondor.py" = ["N802"]
"tests/frozen/m68d/m68d_harness.py" = ["N802"]
"tests/frozen/m74/m74_harness.py" = ["N802"]
# frozen test names spell the bounds they check (T, P, O(N P), MxR), and renaming one changes its id
"tests/frozen/m39/test_repartition_bytes.py" = ["N802"]
"tests/frozen/m39/test_shuffle_benchmark.py" = ["N802"]
"tests/frozen/m39/test_shuffle_execution.py" = ["N802"]
"tests/frozen/m40/test_join_benchmark.py" = ["N802"]
"tests/frozen/m43/test_dask_shuffle_structure.py" = ["N802"]
"tests/frozen/m44/test_transport_task_complexity.py" = ["N802"]
"tests/frozen/m46/test_parsl_relay_repartition.py" = ["N802"]
"tests/frozen/m47/test_parsl_task_shape.py" = ["N802"]

[tool.ruff.lint.isort]
# graphed_exec_local's submodules are sys.modules aliases with no file under src/, so ruff cannot
# find them and would otherwise sort the shim's imports as third-party.
known-first-party = ["graphed_executors", "graphed_exec_local"]

[tool.ruff.format]
# Markdown is excluded: ruff formats python blocks inside .md, which would reflow the README's
# examples (aligned trailing comments, deliberate one-liners) into something less readable. The
# prek hooks only ever pass python/pyi files to the formatter, so this keeps a bare
# `ruff format --check .` — the command CONTRIBUTING gives — agreeing with what CI runs.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]
# the owner's original H->gg processor, kept byte-identical as the m69a oracle
exclude = ['^tests/frozen/m69a/data/inclusive_processor\.py$']
# The test tree has no __init__.py, so without explicit_package_bases every test file would be a
# bare basename and `module = ["tests.frozen.*"]` below could not match it. The repo root as a
# package base gives them dotted names instead (tests.frozen.m40.foo). The two tests/extra dirs with
# sibling helper modules are bases as well, so `import _big_partial` resolves the way pytest's
# prepend import mode resolves it; the frozen dirs must NOT be, since a base there would put their
# files back on bare basenames and un-match the override.
mypy_path = ["src", ".", "tests/extra/hdna", "tests/extra/m41", "tests/extra/m54", "tests/extra/m68d", "examples/hgg"]
explicit_package_bases = true

# Read-only helpers under tests/frozen/{m44,m47,m63,m65,m68c,m68d,m74} that tests import by bare basename: pytest
# puts them on sys.path, mypy knows them only as tests.frozen.mXX.<name>. They stay type-checked
# under those dotted names; only the import site is Any.
[[tool.mypy.overrides]]
module = [
  "transport_harness",
  "parsl_transport_harness",
  "m63_harness",
  "m65a_probe",
  "m65a3_bodies",
  "m65b_probe",
  "m68c_harness",
  "m68d_harness",
  "m74_harness",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "awkward.*",
  "numpy.*",
  "graphed.awkward.*",
  "graphed.numpy.*",
  "graphed_corpus.*",
  "graphed.debug.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# examples/hgg: coffea, higgs_dna, pyarrow, fsspec and graphed_histogram ship no type information, and only
# the test-hgg job installs coffea/higgs_dna/correctionlib; hgg_harness is the frozen m69a harness
# validate_real.py imports.
[[tool.mypy.overrides]]
module = ["coffea.*", "higgs_dna.*", "correctionlib.*", "pyarrow.*", "fsspec", "hgg_harness", "graphed_histogram.*"]
ignore_missing_imports = true

# cloudpickle ships no type information.
[[tool.mypy.overrides]]
module = ["cloudpickle"]
ignore_missing_imports = true

# dask/distributed ship no type information; the dask backend is optional and only imported lazily.
[[tool.mypy.overrides]]
module = [
  "dask.*",
  "distributed.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# parsl ships only partial type info; the parsl backend is optional and only imported lazily (the
# launch helper + the _lazy accessor). Treat parsl as Any, mirroring the dask/distributed override.
[[tool.mypy.overrides]]
module = [
  "parsl.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# the htcondor bindings (and their classad2) ship Linux wheels only and are imported lazily by the
# htcondor backend.
[[tool.mypy.overrides]]
module = ["htcondor2", "htcondor2.*", "classad2"]
ignore_missing_imports = true
follow_imports = "skip"

# ndcctools.taskvine.vine_graph comes only with a CCTools build (not on PyPI) and is imported lazily by the
# vine_graph backend.
[[tool.mypy.overrides]]
module = ["ndcctools", "ndcctools.*"]
ignore_missing_imports = true
follow_imports = "skip"

# tests/frozen/** is read-only under the §A.7 integrity rule, so the strict-mode diagnostics the
# acceptance suites trip are disabled here rather than annotated away in place. This is NOT
# ignore_errors: any code outside this list still fails the frozen tree. src/** and tests/extra/**
# stay fully strict. To re-derive the list, comment this block out and re-run mypy.
[[tool.mypy.overrides]]
module = ["tests.frozen.*"]
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "import-not-found",
  "import-untyped",
  "index",
  "misc",
  "no-any-return",
  "no-untyped-call",
  "no-untyped-def",
  "operator",
  "type-arg",
  "type-var",
  "unused-ignore",
  "var-annotated",
]
